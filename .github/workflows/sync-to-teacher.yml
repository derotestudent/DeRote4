name: Sync to Teacher Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to teacher's repository
        env:
          TOKEN: ${{ secrets.chandan }}
        run: |
          git remote add teacher https://x-access-token:${TOKEN}@github.com/derotestudent/DeRote4.git

          git fetch teacher main

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-edit -X ours teacher/main -m "Merge teacher repository updates"

          git push teacher HEAD:main
          git push teacher --tags